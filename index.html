<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danielle Swyhart — Resume</title>
  <meta name="description" content="Resume of Danielle Swyhart, Senior Site Reliability Engineer. Tailor the resume to a job type and generate a formatted PDF.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
</head>
<body>
  <div class="page">
    <div class="toolbar">
      <div id="controls" class="controls"></div>
      <p id="status" class="status" role="status" hidden></p>
      <p class="toolbar-note">
        Pick a job type, then generate a PDF tailored to it. Every PDF is built in your browser
        with <a href="https://pdfmake.github.io/docs/" rel="noopener">pdfmake</a> and keeps a real
        text layer, so applicant tracking systems can read it.
      </p>
    </div>

    <div class="sheet">
      <header class="hero" id="resume-header"></header>
      <main class="content">
        <section id="experience"></section>
        <section id="skills"></section>
        <section id="courses"></section>
      </main>
    </div>
  </div>

  <script src="assets/js/resume-data.js" defer></script>
  <script src="assets/js/tailor.js" defer></script>
  <script src="vendor/pdfmake.min.js" defer></script>
  <script src="vendor/pdfmake-standard-fonts.js" defer></script>
  <script src="assets/js/pdf.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
